# Binaries for the three platforms. PyInstaller cannot cross-compile, so the
# only honest way to get a mac/linux build from a Windows box is a runner that
# already is one.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - name: self-check
        run: python deltron.py --check
      - name: build
        shell: bash
        run: |
          SEP=":"; [ "${{ runner.os }}" = "Windows" ] && SEP=";"
          # runpy loads the tracks by name, so PyInstaller cannot see them
          # statically. Built from what is on disk rather than a hand-kept
          # list, which drifted every time a track was added.
          HID=""
          for f in *.py; do
            m="${f%.py}"
            [ "$m" = "deltron" ] || HID="$HID --hidden-import $m"
          done
          echo "bundling:$HID"
          pyinstaller --onefile --name deltron \
            --add-data "lyrics.txt${SEP}." \
            --add-data "changelog.txt${SEP}." \
            $HID deltron.py
      - name: smoke test the binary
        shell: bash
        run: |
          BIN=./dist/deltron; [ -f ./dist/deltron.exe ] && BIN=./dist/deltron.exe
          $BIN | grep -q "DELTRON 3030"
          $BIN virus --check      # proves lyrics.txt made it into the bundle
          $BIN upgrade --check    # proves changelog.txt did too
      - uses: actions/upload-artifact@v7
        with:
          name: deltron-${{ matrix.os }}
          path: dist/deltron*
