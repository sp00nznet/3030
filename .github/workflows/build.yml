# Binaries for the three platforms. PyInstaller cannot cross-compile, so the
# only honest way to get a mac/linux build from a Windows box is a runner that
# already is one.
name: build
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pyinstaller
      - name: self-check
        run: python deltron.py --check
      - name: build
        shell: bash
        run: |
          SEP=":"; [ "${{ runner.os }}" = "Windows" ] && SEP=";"
          # runpy loads the tracks by name, so PyInstaller cannot see them statically
          pyinstaller --onefile --name deltron \
            --add-data "lyrics.txt${SEP}." \
            --add-data "changelog.txt${SEP}." \
            --hidden-import virus \
            --hidden-import upgrade \
            --hidden-import y3k \
            --hidden-import mastermind \
            --hidden-import slipping \
            --hidden-import turbulence \
            --hidden-import music \
            deltron.py
      - name: smoke test the binary
        shell: bash
        run: |
          BIN=./dist/deltron; [ -f ./dist/deltron.exe ] && BIN=./dist/deltron.exe
          $BIN | grep -q "DELTRON 3030"
          $BIN virus --check      # proves lyrics.txt made it into the bundle
          $BIN upgrade --check    # proves changelog.txt did too
      - uses: actions/upload-artifact@v4
        with:
          name: deltron-${{ matrix.os }}
          path: dist/deltron*
